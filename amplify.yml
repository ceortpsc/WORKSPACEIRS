version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@9.15.0 --activate
            - pnpm config set store-dir .pnpm-store
            - pnpm install --no-frozen-lockfile
        build:
          commands:
            - APP_VERSION=$(node -p "require('./apps/web/package.json').version")
            - printf "APP_VERSION=%s\nDEPLOYMENT_STAGE=%s\nBUILD_COMMIT=%s\n" "$APP_VERSION" "${AWS_BRANCH:-unknown}" "${AWS_COMMIT_ID:-unknown}" > apps/web/.env.production
            - env | grep -E '^(NEXT_PUBLIC_|IDENTITY_ENABLED|IDENTITY_CONFIGURED|TENANT_ISOLATION_ENABLED|TENANT_ISOLATION_CONFIGURED|DATABASE_ENABLED|DATABASE_CONFIGURED|DOCUMENT_VAULT_ENABLED|DOCUMENT_VAULT_CONFIGURED|AUDIT_ENABLED|AUDIT_CONFIGURED|EVENTS_ENABLED|EVENTS_CONFIGURED|NOTIFICATIONS_ENABLED|NOTIFICATIONS_CONFIGURED|IRS_GATEWAY_ENABLED|IRS_GATEWAY_CONFIGURED|IRS_TDS_ENABLED|IRS_TDS_CONFIGURED|IRS_SOR_ENABLED|IRS_SOR_CONFIGURED|IRS_TIN_MATCHING_ENABLED|IRS_TIN_MATCHING_CONFIGURED|IRS_IRIS_ENABLED|IRS_IRIS_CONFIGURED|PAYROLL_ENGINE_ENABLED|PAYROLL_ENGINE_CONFIGURED|PAYMENTS_ENABLED|PAYMENTS_CONFIGURED|APPLE_RELEASE_ENABLED|APPLE_RELEASE_CONFIGURED|IRS_ADAPTER_MODE)=' >> apps/web/.env.production || true
            - pnpm --filter @ross/web typecheck
            - pnpm --filter @ross/web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - .pnpm-store/**/*
          - node_modules/**/*
          - apps/web/.next/cache/**/*
