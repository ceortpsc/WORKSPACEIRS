name: Web CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOYMENT_STAGE: ci
      APP_VERSION: 1.0.0-ci
      BUILD_COMMIT: ${{ github.sha }}
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      SYNTHETIC_WORKBENCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm typecheck
      - run: pnpm build
      - name: Start production server
        run: |
          nohup pnpm start > /tmp/workspaceirs-server.log 2>&1 &
          echo $! > /tmp/workspaceirs-server.pid
      - name: Smoke and security tests
        env:
          EXPECT_PRODUCTION_READY: "false"
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: pnpm test:smoke
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/workspaceirs-server.log || true
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/workspaceirs-server.pid ]; then
            kill "$(cat /tmp/workspaceirs-server.pid)" || true
          fi
